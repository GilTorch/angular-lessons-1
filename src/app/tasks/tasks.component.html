@if(isAddingTask){
    <app-new-task [userId]="user()!.id" (close)="onCancelDialog()"></app-new-task>
}
<section id ='tasks'>
    <header>
        <h2>{{ user()?.name }}</h2>
    </header>
    <menu>
        <button (click)="onStartAddTask()">Add Task</button>
    </menu>
    <ul>
        <li *ngFor="let task of selectedUserTasks">
            <app-task [task]="task" (complete)="onCompleteTask($event)"></app-task>
        </li>
    </ul>
</section>
