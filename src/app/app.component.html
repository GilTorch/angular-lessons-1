<app-header></app-header>
<main>
    <ul>
        <li *ngFor="let user of users"><app-user [user]="user" (select)="onSelectUser($event)"></app-user></li>
    </ul>
    <app-tasks *ngIf="selectedUser; else fallback" [user]="selectedUser"></app-tasks>
    <ng-template #fallback>
        <p>No user selected yet</p>
    </ng-template>
</main>
